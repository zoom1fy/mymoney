[package]
name = "mymoney"
version = "0.1.0"
edition = "2021"

[lib]
name = "mymoney_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Fat LTO with a single codegen unit serialized the release build behind one
# codegen pass, which dominated CI wall-clock. Thin LTO retains most of the
# cross-crate inlining and lets rustc use every core; the webview does the heavy
# lifting here, so the missed optimization is not worth the build time.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
