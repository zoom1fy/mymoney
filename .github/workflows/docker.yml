name: Docker

on:
  push:
    branches: [main, develop]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_DEFAULT_PLATFORM: linux/amd64

jobs:
  docker-integration:
    name: Docker Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=test
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=test_db
          DATABASE_URL=postgresql://test:test_password@db:5432/test_db
          JWT_SECRET=test_secret_key_for_ci
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          NODE_ENV=production
          CORS_ORIGINS=http://localhost:3001
          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASS=
          SMTP_FROM=test@localhost
          SMTP_TLS=false
          NEXT_PUBLIC_API_URL=http://localhost:3001/api
          NEXT_PUBLIC_COOKIE_DOMAIN=localhost
          DOCKER_DEFAULT_PLATFORM=linux/amd64
          EOF

      - name: Build production images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend frontend

      - name: Start production stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

      - name: Wait for healthy containers
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps \
              | grep -E "unhealthy|starting|exited" || true)
            if [ -z "$unhealthy" ]; then
              echo "All containers healthy after ${i} attempts"
              exit 0
            fi
            echo "attempt ${i}: waiting ($(echo $unhealthy | tr '\n' ' '))"
            sleep 2
          done
          echo "❌ Containers did not become healthy in time"
          exit 1

      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || true)
            if [ "$status" = "200" ]; then
              echo "✅ Smoke test passed on attempt ${i}: nginx returned $status"
              exit 0
            fi
            echo "attempt ${i}: nginx not ready yet ($status)"
            sleep 3
          done
          echo "❌ Smoke test failed: nginx never returned 200"
          exit 1

      - name: Show logs if failed
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs

      - name: Stop containers
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v

  notify:
    name: Notify
    needs: [docker-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🐳 Docker ${{ needs.docker-integration.result }}
            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Author: ${{ github.actor }}
            💬 Message: ${{ github.event.head_commit.message }}
            🔗 View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
