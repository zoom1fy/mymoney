name: Docker

on:
  push:
    branches: [main, develop]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  # Explicit because the layer caches in docker-compose.ci.yml are only consulted
  # when the build runs through BuildKit.
  DOCKER_BUILDKIT: "1"

jobs:
  docker-integration:
    name: Docker Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=test
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=test_db
          DATABASE_URL=postgresql://test:test_password@db:5432/test_db
          JWT_SECRET=test_secret_key_for_ci
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          NODE_ENV=production
          NEXT_PUBLIC_API_URL=http://localhost:3001/api
          NEXT_PUBLIC_COOKIE_DOMAIN=localhost
          DOCKER_DEFAULT_PLATFORM=linux/amd64
          EOF

      - name: Set compose alias
        # docker-compose.ci.yml only adds the type=gha layer cache backends.
        run: echo "COMPOSE=docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ci.yml" >> "$GITHUB_ENV"

      - name: Build and start production stack
        # One invocation instead of a separate `build` followed by `up`, so the
        # images under test are exactly the ones just built. `adminer` is left
        # out on purpose: nothing in the smoke test talks to it.
        run: |
          $COMPOSE up -d --build db redis backend frontend nginx

      - name: Wait for healthy containers
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3001/ || true)
            if [ "$status" = "200" ]; then
              echo "Stack is serving HTTP 200 after ${i} attempts"
              exit 0
            fi
            # Container states are sampled every 5th iteration only: it still
            # fails fast on a crashed service, but stops spawning a compose
            # subprocess on every single poll.
            if [ $((i % 5)) -eq 0 ]; then
              broken=$($COMPOSE ps --format '{{.Service}} {{.State}} {{.Health}}' \
                | grep -E 'exited|unhealthy' || true)
              if [ -n "$broken" ]; then
                echo "❌ Container not healthy:"
                echo "$broken"
                exit 1
              fi
            fi
            echo "attempt ${i}: http=${status}"
            sleep 2
          done
          echo "❌ Stack did not become healthy in time"
          $COMPOSE ps
          exit 1

      - name: Show logs if failed
        if: failure()
        run: $COMPOSE logs

      - name: Stop containers
        if: always()
        run: $COMPOSE down -v

  notify-failure:
    name: Notify on failure
    needs: [docker-integration]
    # Skipped on success, so the Telegram message only fires on a broken stack.
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🐳 Docker integration ${{ needs.docker-integration.result }}
            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Author: ${{ github.actor }}
            💬 Message: ${{ github.event.head_commit.message }}
            🔗 View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
