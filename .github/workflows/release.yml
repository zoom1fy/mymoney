name: Release

on:
  push:
    tags:
      - "v*"

# `contents: write` lets the workflow create and publish the release; `actions:
# read` lets the gate inspect the CI runs for this commit.
permissions:
  contents: write
  actions: read

jobs:
  # The tag push starts CI and this workflow at the same time. Block the build
  # until the CI run for this exact commit finishes green, so an untested tag can
  # never ship.
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the CI workflow to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match on the tag name: the same commit may also have a branch CI run,
          # and only the tag's run guards this release.
          deadline=$((SECONDS + 3600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --limit 20 \
              --json headBranch,event,status,conclusion 2>/dev/null || echo '[]')"
            run="$(echo "$runs" | jq -c --arg tag "$GITHUB_REF_NAME" \
              '[.[] | select(.headBranch == $tag and .event == "push")][0] // empty')"

            if [ -n "$run" ]; then
              status="$(echo "$run" | jq -r '.status')"
              conclusion="$(echo "$run" | jq -r '.conclusion // empty')"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed for $GITHUB_REF_NAME"
                  exit 0
                fi
                echo "::error::CI concluded with '$conclusion'; refusing to release."
                exit 1
              fi

              echo "CI status: $status; waiting..."
            else
              echo "CI run for $GITHUB_REF_NAME not registered yet; waiting..."
            fi

            sleep 20
          done

          echo "::error::Timed out waiting for CI to finish."
          exit 1

  # A single job owns the release. The matrix below would otherwise race each
  # other on GitHub's API and the losing jobs would fail with "already_exists".
  create-release:
    name: Create Release
    needs: [ci-gate]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo
            const tag = process.env.RELEASE_TAG

            // Re-runs must reuse the existing release instead of failing.
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              })
              return data.id
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `MyMoney ${tag}`,
              generate_release_notes: true,
              draft: true,
              prerelease: false
            })
            return data.id

  desktop-build:
    name: Desktop Build
    needs: [ci-gate, create-release]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            args: ""
          - platform: macos-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      - name: Set Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop/src-tauri -> target

      # setup-bun caches the bun binary only, leaving the package store to be
      # re-downloaded on every run.
      - name: Cache bun package store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      # releaseId targets the draft created above. tagName + releaseDraft are a
      # fallback: if the releaseId output is ever empty, the action still finds
      # the existing draft by tag instead of silently skipping the asset upload.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true

  publish-release:
    name: Publish Release
    needs: [create-release, desktop-build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  notify-failure:
    name: Notify on failure
    needs: [ci-gate, create-release, desktop-build, publish-release]
    # Skipped on success: only a failed gate, build or publish reaches Telegram.
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔖 Release ${{ github.ref_name }}
            🚦 CI gate: ${{ needs.ci-gate.result }} — build: ${{ needs.desktop-build.result }}
            ⬆️ Publish: ${{ needs.publish-release.result }}
            📦 Repository: ${{ github.repository }}
            🔗 View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
