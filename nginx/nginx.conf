worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # ----------- RATE LIMITING -----------

    # General: 30 req/s per IP, burst 50
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Auth: 5 req/min per IP (login, register, forgot, reset, verify)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Connections: max 10 concurrent per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Docker's embedded DNS. Resolve upstream hosts at request time,
    # so nginx does not fail at startup if a container is not ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # ----------- GLOBAL LIMITS -----------
        limit_req zone=general burst=50 nodelay;
        limit_conn addr 10;
        limit_conn_log_level warn;
        limit_req_log_level warn;

        # 429 response
        error_page 429 @rate_limited;
        location @rate_limited {
            add_header Retry-After "1";
            return 429 '{"statusCode":429,"message":"Too many requests. Please slow down."}';
        }

        # Forward real IP to backend
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # ----------- AUTH (stricter limit) -----------
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;

            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # ----------- API -----------
        location /api/ {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # ----------- FRONTEND -----------
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
